<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#765cff">
<meta name="description" content="Nova AI — a polished assistant that runs entirely in your browser.">
<title>Nova AI — Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#090b10;--panel:#10131a;--panel2:#171b24;--border:#272d39;--text:#f7f8fc;--muted:#9aa3b3;--accent:#765cff;--accent2:#a05cff;--user:#292f3b;--shadow:0 18px 55px #0005}
body.light{--bg:#f5f7fb;--panel:#fff;--panel2:#eef1f6;--border:#dce1e9;--text:#111827;--muted:#667085;--user:#e6eaf0;--shadow:0 18px 55px #34405418}
html,body{height:100%}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,textarea,select,input{font:inherit}
.app{height:100%;display:flex}
.sidebar{width:276px;flex:0 0 276px;background:var(--panel);border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;z-index:20;transition:.25s}
.brand{display:flex;align-items:center;gap:11px;font-size:21px;font-weight:800;margin:3px 4px 20px}
.brandIcon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px #765cff35}
.newChat{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:12px;border-radius:12px;cursor:pointer;text-align:left;font-weight:650}
.newChat:hover,.sideBtn:hover,.suggestion:hover{border-color:var(--accent);background:var(--panel2)}
.historyLabel{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:22px 7px 8px}
.history{flex:1;overflow:auto}
.historyItem{padding:11px;border-radius:10px;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.historyItem:hover{background:var(--panel2);color:var(--text)}
.bottom{border-top:1px solid var(--border);padding-top:10px}
.sideBtn{width:100%;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;padding:10px;border-radius:9px;cursor:pointer}
.main{min-width:0;flex:1;display:flex;flex-direction:column}
.top{height:64px;flex:0 0 64px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:11px;background:color-mix(in srgb,var(--panel) 86%,transparent)}
.menu{display:none;border:0;background:transparent;color:var(--text);font-size:23px;cursor:pointer}
.model{font-weight:800}
.topRight{margin-left:auto;display:flex;gap:8px}.icon{width:38px;height:38px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);cursor:pointer}
.chat{flex:1;overflow:auto;padding:24px 18px}.messages{width:min(920px,100%);margin:auto}
.welcome{text-align:center;padding:9vh 12px 30px}.heroIcon{width:78px;height:78px;margin:0 auto 20px;border-radius:25px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:38px;box-shadow:0 18px 45px #765cff30}.welcome h1{font-size:36px;letter-spacing:-.03em;margin-bottom:9px}.welcome p{color:var(--muted)}
.suggestions{max-width:740px;margin:34px auto;display:grid;grid-template-columns:1fr 1fr;gap:11px}.suggestion{padding:15px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:14px;text-align:left;cursor:pointer}.suggestion strong{display:block;margin-bottom:4px}.suggestion span{font-size:12px;color:var(--muted)}
.message{display:flex;gap:12px;margin:25px 0;animation:up .18s ease}.message.ai .avatar{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.message.user .avatar{background:var(--user)}
@keyframes up{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.avatar{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:grid;place-items:center;font-size:16px}.messageContent{min-width:0;line-height:1.7;overflow-wrap:anywhere}.messageContent p{white-space:pre-wrap;margin:0 0 10px}.messageContent p:last-child{margin-bottom:0}.messageName{font-size:11px;color:var(--muted);margin-bottom:3px}
.messageContent code{background:var(--panel2);border:1px solid var(--border);padding:1px 5px;border-radius:5px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.9em}
.codeBlock{position:relative;margin:10px 0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#0d1117}
body.light .codeBlock{background:#0d1117}
.codeBlockHead{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#161b22;border-bottom:1px solid var(--border);font-size:11px;color:#9aa3b3}
.codeBlock pre{margin:0;padding:14px;overflow:auto;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55}
.codeBlock code{background:none;border:0;padding:0;color:#e6edf3}
.copyBtn{border:1px solid #30363d;background:#21262d;color:#c9d1d9;padding:3px 9px;border-radius:6px;cursor:pointer;font-size:11px}
.copyBtn:hover{background:#30363d}
.typing{display:flex;gap:4px;padding:9px 0}.typing i{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{0%,60%,100%{transform:none}30%{transform:translateY(-5px)}}
.inputArea{padding:10px 18px 17px}.inputBox{width:min(920px,100%);margin:auto;display:flex;align-items:flex-end;gap:8px;padding:9px;border:1px solid var(--border);background:var(--panel);border-radius:18px;box-shadow:var(--shadow)}textarea{flex:1;min-height:43px;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:10px 8px;line-height:1.4}textarea::placeholder{color:var(--muted)}.send{width:43px;height:43px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;font-size:18px}.send:disabled{opacity:.45}.disclaimer{text-align:center;color:var(--muted);font-size:10px;margin-top:8px}
.overlay{position:fixed;inset:0;background:#0008;display:none;z-index:40}.overlay.active{display:block}.settings{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 30px));max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:22px;display:none;box-shadow:var(--shadow)}.settings.active{display:block}.settingsHead{display:flex;justify-content:space-between;margin-bottom:22px}.close{border:0;background:none;color:var(--text);font-size:25px;cursor:pointer}.setting{margin-bottom:18px}.setting label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.setting select,.setting input{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:var(--text)}.setting small{display:block;color:var(--muted);font-size:11px;margin-top:6px;line-height:1.5}.save{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;font-weight:700}
.sectionLabel{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:20px 0 10px}
.sectionLabel:first-of-type{margin-top:0}
@media(max-width:700px){.sidebar{position:fixed;left:-290px;top:0;bottom:0;box-shadow:18px 0 50px #0007}.sidebar.open{left:0}.menu{display:block}.suggestions{grid-template-columns:1fr}.welcome{padding-top:7vh}.welcome h1{font-size:28px}.chat{padding:14px}.inputArea{padding:8px 10px 12px}.top{padding:0 12px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brandIcon">✦</div>Nova AI</div>
  <button class="newChat" onclick="newChat()">＋ New chat</button>
  <div class="historyLabel">Conversations</div>
  <div class="history" id="history"></div>
  <div class="bottom">
    <button class="sideBtn" onclick="openSettings()">⚙️ Settings</button>
    <button class="sideBtn" onclick="clearHistory()">🗑️ Clear history</button>
  </div>
</aside>

<main class="main">
<header class="top">
  <button class="menu" onclick="toggleSidebar()">☰</button>
  <div class="model">Nova AI</div>
  <div class="topRight">
    <button class="icon" aria-label="Toggle theme" onclick="toggleTheme()">☀️</button>
    <button class="icon" aria-label="Settings" onclick="openSettings()">⚙️</button>
  </div>
</header>

<section class="chat" id="chat"><div class="messages" id="messages">
<div class="welcome" id="welcome">
  <div class="heroIcon">✦</div>
  <h1>What can I help with?</h1>
  <p id="welcomeSub">A private assistant that runs entirely in your browser.</p>
  <div class="suggestions">
    <button class="suggestion" onclick="ask('Write a Python function that reverses a linked list, with comments')"><strong>💻 Coding help</strong><span>Write &amp; explain real code</span></button>
    <button class="suggestion" onclick="ask('Review this function for bugs and suggest improvements')"><strong>🔍 Code review</strong><span>Find bugs, suggest fixes</span></button>
    <button class="suggestion" onclick="ask('Tell me a short story')"><strong>📖 Tell me a story</strong><span>Make up an adventure</span></button>
    <button class="suggestion" onclick="ask('What can you do?')"><strong>🤖 What can you do?</strong><span>Explore Nova's abilities</span></button>
  </div>
</div>
</div></section>

<div class="inputArea">
  <div class="inputBox">
    <textarea id="input" rows="1" placeholder="Message Nova AI..." onkeydown="keyDown(event)" oninput="resizeInput(this)"></textarea>
    <button class="send" id="send" onclick="send()">➤</button>
  </div>
  <div class="disclaimer">Nova AI runs entirely in this browser. Nothing you type ever leaves your device.</div>
</div>
</main>
</div>

<div class="overlay" id="overlay" onclick="closeSettings()"></div>
<div class="settings" id="settings">
  <div class="settingsHead"><h2>Settings</h2><button class="close" onclick="closeSettings()">×</button></div>

  <div class="sectionLabel">Appearance</div>
  <div class="setting"><label>Theme</label><select id="themeSelect" onchange="changeTheme(this.value)"><option value="dark">Dark</option><option value="light">Light</option></select></div>
  <div class="setting"><label>Assistant personality</label><select id="personality"><option value="friendly">Friendly</option><option value="funny">Funny</option><option value="professional">Professional</option><option value="coding">Coding expert 👨‍💻</option><option value="pirate">Pirate 🏴‍☠️</option></select></div>

  <button class="save" onclick="saveSettings()">Save settings</button>
</div>

<script>
let conversation=[];
let memory=JSON.parse(localStorage.getItem("novaMemory")||"{}");
let chats=JSON.parse(localStorage.getItem("novaChats")||"[]");
let personality=localStorage.getItem("novaPersonality")||"friendly";
let currentChat=null;

const input=document.getElementById("input"),messages=document.getElementById("messages"),sendButton=document.getElementById("send");

function saveMemory(){localStorage.setItem("novaMemory",JSON.stringify(memory))}
function random(a){return a[Math.floor(Math.random()*a.length)]}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function scroll(){setTimeout(()=>{const c=document.getElementById("chat");c.scrollTop=c.scrollHeight},20)}

async function send(){
  const text=input.value.trim(); if(!text)return;
  input.value="";resizeInput(input);document.getElementById("welcome")?.remove();
  addMessage("user",text);conversation.push({role:"user",content:text});saveChat();sendButton.disabled=true;

  const remember=text.match(/remember (?:that )?my name is (.+)/i);
  if(remember){memory.name=remember[1].trim();saveMemory()}

  const typing=typingMessage();
  await wait(350);
  const answer=generateAI(text);
  typing.remove();
  addMessage("ai",answer);conversation.push({role:"assistant",content:answer});saveChat();sendButton.disabled=false;input.focus();
}

// ---- Offline response engine ----
function generateAI(text){
  const original=text.trim(),t=original.toLowerCase();

  if(looksLikeCode(original))return codeReview(original);

  const remember=t.match(/remember (?:that )?my name is (.+)/i);
  if(remember){memory.name=remember[1].trim();saveMemory();return personalityText("Got it! I'll remember that your name is "+memory.name+".")}
  if(t.includes("what is my name")||t.includes("do you know my name"))return memory.name?"Your name is "+memory.name+".":"You haven't told me your name yet. Try: “Remember that my name is Alex.”";
  if(/^(hi|hello|hey|yo|sup|hiya)\b/.test(t))return personalityText("Hey"+(memory.name?" "+memory.name:"")+"! 👋 What are we building today?");
  if(t.includes("thank"))return personalityText("You're welcome! 😎");
  if(t.includes("who are you")||t.includes("what are you"))return personalityText("I'm Nova AI — a private assistant that runs entirely in this browser tab. Ask me for code, quick math, ideas, or just to chat.");
  if(t.includes("what can you do")||t.includes("what do you do"))return `I can do quite a few things! 🤖

• 💬 Chat with you
• 🧠 Remember your name
• 🧮 Calculate math
• 😂 Tell jokes
• 📖 Create short stories
• 💻 Help with HTML, CSS, JavaScript, and Python snippets
• 🔍 Spot common bugs in code you paste me
• 🎮 Suggest game ideas
• 🎨 Give creative/project ideas
• 🌓 Switch themes and personality
• 💾 Save conversations in your browser

Try asking me something, or paste in some code!`;
  if(/^[0-9+\-*/().%\s]+$/.test(original)){try{const result=Function('"use strict";return ('+original+')')();if(typeof result==="number"&&Number.isFinite(result))return "🧮 The answer is "+result+"."}catch(e){}}
  if(t.includes("what time")||t==="time")return "🕒 Your computer's current time is "+new Date().toLocaleTimeString()+".";
  if(t.includes("what date")||t.includes("today's date")||t==="date")return "📅 Today is "+new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})+".";
  if(t.includes("joke")||t.includes("make me laugh"))return random(["😂 Why did the computer go to the doctor? Because it had a virus!","🤣 Why was the JavaScript developer sad? Because they didn't know how to null their feelings.","😂 What do computers eat? Microchips!","🐱 Why did the cat sit on the computer? It wanted to keep an eye on the mouse.","🎮 Why did the gamer bring a ladder? Because they wanted to reach the next level!"]);
  if(t.includes("tell me a story")||t.includes("make a story")||t.includes("short story"))return random([`📖 The Last Button

Alex found a strange red button on an old computer.

A message appeared: “DO NOT PRESS.”

Alex stared at it.

“Obviously I'm pressing it.”

CLICK.

The screen flashed.

“CAT MODE ACTIVATED.”

A cat appeared.

The cat pressed the button again.

“HUMAN MODE ACTIVATED.”

Alex slowly looked at the cat.

The cat looked back.

“Meow.”

Alex realized the cat had been controlling the computer all along. 🐱`,`📖 The Tiny Robot

Bolt wanted to become the strongest robot in the world.

He trained every day. He lifted batteries, raced charging cables, and even challenged a vacuum cleaner.

One day, Bolt won.

He became the strongest robot in the house.

Then his owner picked him up.

“Aww, who's my little robot?”

Bolt sighed.

Even the strongest robot could not escape being adorable. 🤖`]);
  if(t.includes("cat"))return "🐱 Cats are mysterious creatures. They can sleep for hours, ignore you on purpose, and somehow know exactly when you are opening food.";
  if(t.includes("dog"))return "🐶 Dogs have one amazing superpower: turning absolutely any ordinary event into the greatest event of their lives.";
  if(t.includes("html")||t.includes("javascript")||t.includes("css")||t.includes("coding")||t.includes("code")||t.includes("python")||t.includes("function")||t.includes("bug")||t.includes("algorithm")||t.includes("array")||t.includes("loop")||t.includes("fizzbuzz")||t.includes("factorial")||t.includes("fibonacci")||t.includes("palindrome")||t.includes("prime")||t.includes("regex")||t.includes("json")||t.includes("recursion")||t.includes("recursive")||t.includes("class ")||t.includes("debounce")||t.includes("promise")||t.includes("async"))return codingResponse(t,original);
  if(t.includes("game")||t.includes("video game"))return `🎮 Here are some game ideas:

1. ⚽ Soccer game
2. 🏎️ Racing game
3. 🧟 Zombie survival
4. 🚀 Space shooter
5. 🧩 Puzzle game
6. 🏰 Tower defense
7. 🥷 Ninja game
8. 🐱 Cat adventure
9. 🎢 Roller coaster simulator
10. 🌎 Open-world explorer`;
  if(t.includes("weather"))return "🌤️ I run entirely offline in your browser, so I can't check live weather — check a weather app or site for that.";
  if(t.includes("artificial intelligence")||t.includes("how does ai work"))return "🧠 Broadly, AI systems learn statistical patterns from large amounts of data, then use those patterns to predict or generate outputs (like the next word in a sentence). I'm a much simpler example: my replies come from pattern-matching rules written directly in JavaScript, running entirely in this browser tab.";
  if(t==="help"||t.includes("help me"))return `Sure! 😎 Try:

“Write a Python function that reverses a linked list”
“Tell me a joke”
“Give me a game idea”
“Write HTML for a button”
“Calculate 25 * 8”
“Remember that my name is Alex”
“What is my name?”
“Tell me a story”
“What can you do?”`;
  if(t.includes("idea")||t.includes("ideas"))return `💡 Random project idea:

Build “The Weakest Human.”

You play as the weakest person alive and survive increasingly ridiculous challenges:

🥊 Fight a chicken
🎢 Ride a giant roller coaster
✈️ Survive your first flight
🌋 Escape a volcano
👽 Defeat an alien

The character gets stronger every time something ridiculous happens. 😂`;
  if(t==="bye"||t.includes("goodbye"))return personalityText("See you later! 👋");
  return personalityText(random([`Interesting! 🤔 Tell me a little more about “${original}”.`,"That's a good question — I don't have a specific canned answer for that one yet. Try asking about code, math, jokes, stories, or ideas.","I can help with that if you give me a little more detail.","Interesting idea! Want to turn it into a game, website, story, or project?"]));
}

// ---- Real static analysis for pasted code (not just keyword matching) ----
function analyzeCode(src){
  const issues=[];
  const openers={"(":")","[":"]","{":"}"};
  const closers={")":"(","]":"[","}":"{"};
  const stack=[];
  let line=1;
  for(const ch of src){
    if(ch==="\n")line++;
    if(openers[ch])stack.push({ch,line});
    else if(closers[ch]){
      const top=stack.pop();
      if(!top||top.ch!==closers[ch])issues.push("Unmatched '"+ch+"' around line "+line+(top?" — expected a closing '"+openers[top.ch]+"' first":""));
    }
  }
  stack.forEach(s=>issues.push("Unclosed '"+s.ch+"' opened on line "+s.line+" — never closed"));
  const dq=(src.match(/"/g)||[]).length,sq=(src.match(/'/g)||[]).length;
  if(dq%2!==0)issues.push('Odd number of " characters — a string literal may be unclosed');
  if(sq%2!==0)issues.push("Odd number of ' characters — a string literal may be unclosed");
  if(/if\s*\([^()]*[^=!<>]=[^=][^()]*\)/.test(src))issues.push("Possible '=' (assignment) where '==' or '===' (comparison) was meant, inside an if(...) condition");
  if(/\bfor\s*\(([^;()]*)\)/.test(src)&&!/\bfor\s*\([^;()]*;[^;()]*;[^;()]*\)/.test(src)&&/\bfor\s*\(/.test(src.match(/for\s*\([^)]*\)/)?.[0]||"")&&!(/for\s*\(\s*(const|let|var)\s+\w+\s+(in|of)\s+/.test(src)))issues.push("A for(...) loop may be missing its semicolons — expected for(init; condition; step)");
  return issues;
}
function looksLikeCode(s){return /\n/.test(s)&&/[{}();]/.test(s)&&s.length>40}
function codeReview(original){
  const issues=analyzeCode(original);
  if(issues.length)return "🔍 I scanned what you pasted and found:\n\n"+issues.map(i=>"• "+i).join("\n")+"\n\nWorth checking those first — structural issues like these usually break everything downstream before any actual logic runs.";
  return "🔍 I didn't find any unbalanced brackets, unclosed strings, or an `=`/`==` mix-up in an if(...) — so if it's still misbehaving, the bug is likely logical rather than structural. Common culprits: an off-by-one loop bound, a variable mutated somewhere unexpected, a comparison that's true/false when you didn't expect, or a `return` firing earlier than intended. Tell me what you expected vs. what actually happened and I can narrow it down further.";
}

function codingResponse(t,original){
  if(looksLikeCode(original))return codeReview(original);

  if(t.includes("soccer")||t.includes("football"))return "⚽ A simple playable soccer mini-game — arrow keys move the blue player, bump the ball to kick it, score by getting it into the top goal:\n\n```html\n<canvas id=\"c\" width=\"480\" height=\"320\" style=\"background:#1a8f3c;display:block;margin:auto\"></canvas>\n<script>\nconst cv=document.getElementById('c'),ctx=cv.getContext('2d');\nlet player={x:240,y:280,r:14},ball={x:240,y:160,r:9,vx:0,vy:0},score=0,keys={};\naddEventListener('keydown',e=>keys[e.key]=true);\naddEventListener('keyup',e=>keys[e.key]=false);\nfunction update(){\n  const s=3;\n  if(keys['ArrowLeft'])player.x-=s;\n  if(keys['ArrowRight'])player.x+=s;\n  if(keys['ArrowUp'])player.y-=s;\n  if(keys['ArrowDown'])player.y+=s;\n  player.x=Math.max(14,Math.min(466,player.x));\n  player.y=Math.max(14,Math.min(306,player.y));\n  const dx=ball.x-player.x,dy=ball.y-player.y,dist=Math.hypot(dx,dy)||1;\n  if(dist<player.r+ball.r+4){ball.vx=dx/dist*6;ball.vy=dy/dist*6}\n  ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.98;ball.vy*=.98;\n  if(ball.x<9||ball.x>471)ball.vx*=-1;\n  if(ball.y<9)ball.vy*=-1;\n  if(ball.y>311){ball.x=240;ball.y=160;ball.vx=0;ball.vy=0}\n  if(ball.y<25&&ball.x>190&&ball.x<290){score++;ball.x=240;ball.y=160;ball.vx=0;ball.vy=0}\n}\nfunction draw(){\n  ctx.clearRect(0,0,480,320);\n  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(5,5,470,310);\n  ctx.strokeStyle='#ffe27a';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(190,5);ctx.lineTo(290,5);ctx.stroke();\n  ctx.fillStyle='#fff';ctx.font='16px sans-serif';ctx.fillText('Score: '+score,10,300);\n  ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,7);ctx.fillStyle='#1e3a8a';ctx.fill();\n  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fillStyle='#fff';ctx.fill();\n}\nfunction loop(){update();draw();requestAnimationFrame(loop)}\nloop();\n<\/script>\n```\n\nSave that as an .html file and open it — arrow keys to move, bump the ball into the yellow goal line to score.";

function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function renderContent(container,text){
  container.innerHTML="";
  const parts=text.split(/```(\w*)\n?([\s\S]*?)```/g);
  for(let i=0;i<parts.length;i+=3){
    const plain=parts[i];
    if(plain){
      plain.split(/\n{2,}/).forEach(para=>{
        if(!para.trim())return;
        const p=document.createElement("p");
        const withInlineCode=escapeHtml(para).replace(/`([^`]+)`/g,"<code>$1</code>");
        p.innerHTML=withInlineCode;
        container.appendChild(p);
      });
    }
    const lang=parts[i+1],code=parts[i+2];
    if(code!==undefined){
      const block=document.createElement("div");block.className="codeBlock";
      const head=document.createElement("div");head.className="codeBlockHead";
      const label=document.createElement("span");label.textContent=lang||"code";
      const btn=document.createElement("button");btn.className="copyBtn";btn.textContent="Copy";
      btn.onclick=()=>{navigator.clipboard.writeText(code).then(()=>{btn.textContent="Copied!";setTimeout(()=>btn.textContent="Copy",1200)})};
      head.append(label,btn);
      const pre=document.createElement("pre");const codeEl=document.createElement("code");codeEl.textContent=code.replace(/\n$/,"");pre.appendChild(codeEl);
      block.append(head,pre);container.appendChild(block);
    }
  }
  if(!container.children.length)container.textContent=text;
}

}
